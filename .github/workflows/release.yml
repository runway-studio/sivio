name: Release Sivio
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to validate (or existing tag for a draft)
        required: true
        type: string
      validate_only:
        description: Build this branch and verify signed artifacts without creating a tag or Release
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: sivio-release-publication
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.validate_only && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned tools
        run: |
          npm install --global pnpm@10.13.1
          rustup toolchain install 1.99.0 --profile minimal
          test "$(uname -m)" = arm64
      - name: Validate source and version
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only }}
        run: |
          python3 scripts/release/version.py check --tag "$RELEASE_TAG"
          if [ "$VALIDATE_ONLY" != true ]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -f "docs/releases/$RELEASE_TAG.md"
          python3 scripts/release/privacy.py --source --history
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Build and sign final offline bundle
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only }}
          SIVIO_CODESIGN_IDENTITY: ${{ vars.SIVIO_CODESIGN_IDENTITY }}
          SIVIO_CERTIFICATE_P12: ${{ secrets.SIVIO_CERTIFICATE_P12 }}
          SIVIO_CERTIFICATE_PASSWORD: ${{ secrets.SIVIO_CERTIFICATE_PASSWORD }}
          SIVIO_SIGNING_KEYCHAIN: ${{ secrets.SIVIO_SIGNING_KEYCHAIN }}
          SIVIO_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.SIVIO_SIGNING_KEYCHAIN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=()
          if [ "$VALIDATE_ONLY" = true ]; then args+=(--validate-only); fi
          python3 scripts/release/build.py --tag "$RELEASE_TAG" "${args[@]}"
      - name: Verify and assemble release assets
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          python3 scripts/release/manifest.py --report build/reports/app-aarch64-artifact.json --tag "$RELEASE_TAG" --notes "docs/releases/$RELEASE_TAG.md" --output dist/release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sivio-release-assets
          path: dist/release-assets/
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics on failure
        if: failure()
        run: echo 'Raw build logs are not uploaded; inspect the bounded workflow diagnostics.'
  consumer:
    needs: build
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sivio-release-assets
          path: dist/release-assets
      - name: Verify DMG and fresh helper without signing credentials
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: python3 scripts/validation/dmg-consumer.py --assets dist/release-assets --version "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sivio-dmg-consumer-evidence
          path: build/reports/dmg-consumer.json
          if-no-files-found: error
  publish:
    needs: [build, consumer]
    if: github.event_name == 'push' || !inputs.validate_only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sivio-release-assets
          path: dist/release-assets
      - name: Build signature verifier
        env:
          CARGO_HOME: ${{ github.workspace }}/build/cache/cargo
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --locked --manifest-path scripts/release/verifier/Cargo.toml
      - name: Publish complete release or prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          TRIGGER: ${{ github.event_name }}
        run: |
          args=()
          if [ "$TRIGGER" = push ]; then args+=(--publish); fi
          python3 scripts/release/publish.py --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" --assets dist/release-assets "${args[@]}"
