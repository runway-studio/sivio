name: Native upgrade validation
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published test prerelease tag (vX.Y.Z-rc.N)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sivio-native-upgrade-validation
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate source and install tools
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release/version.py check --tag "$RELEASE_TAG"
          python3 scripts/release/privacy.py --source --history
          npm install --global pnpm@10.13.1
          rustup toolchain install 1.99.0 --profile minimal
      - name: Upgrade native application with disposable data
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          SIVIO_CODESIGN_IDENTITY: ${{ vars.SIVIO_CODESIGN_IDENTITY }}
          SIVIO_SIGNING_KEYCHAIN: ${{ secrets.SIVIO_SIGNING_KEYCHAIN }}
          SIVIO_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.SIVIO_SIGNING_KEYCHAIN_PASSWORD }}
        run: python3 scripts/validation/native-upgrade.py --tag "$RELEASE_TAG"
      - name: Check diagnostic summary
        id: evidence
        if: always()
        run: |
          mkdir -p dist/native-upgrade-evidence
          if [ -f build/reports/native-upgrade.json ]; then
            cp build/reports/native-upgrade.json dist/native-upgrade-evidence/
          fi
          python3 scripts/release/privacy.py --assets dist/native-upgrade-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: native-upgrade-evidence
          path: dist/native-upgrade-evidence/
          if-no-files-found: ignore
          retention-days: 7
