[package]
name = "sivio-desktop"
version = "0.1.1-rc.2"
description = "Your Shortcut to AI"
authors = ["Jason Young"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.99.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cc_switch_lib"
crate-type = ["rlib"]
doctest = false

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
test-hooks = []
upgrade-validation = []

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
zeroize = "=1.8.2"
sysproxy = { path = "../../native/sysproxy", default-features = false }
percent-encoding = "2"
tar = "=0.4.44"
plist = "=1.8.0"
ring = "=0.17.14"
minisign-verify = "=0.2.5"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
rust_iso3166 = "=0.2.0"
clash_verge_service_ipc = { path = "../../native/helper", features = ["client"] }
serde_yaml_ng = "=0.10.0"
smartstring = { version = "1.0.1", features = ["serde"] }
security-framework = "=3.7.0"

serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "=2.12.1", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
dirs = "5.0"
toml = "0.8"
toml_edit = "0.22"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream", "socks"] }
arboard = "3.6"
flate2 = "1"
xz2 = { version = "=0.1.7", features = ["static"] }
brotli = "7"
zstd = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1.5"
axum = { version = "0.7", features = ["ws"] }
subtle = "=2.6.1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client-legacy"] }
hyper-rustls = { version = "0.27", features = ["http1", "tls12", "ring", "webpki-tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
httparse = "1"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
rustls-native-certs = "0.8"
regex = "1.10"
rquickjs = { version = "0.8", features = ["array-buffer", "classes"] }
thiserror = "2.0"
anyhow = "1.0"
zip = "2.2"
serde_yaml = "0.9"
tempfile = "3"
url = "2.5"
auto-launch = "0.5"
once_cell = "1.21.3"
base64 = "0.22"
# 校验自定义供应商图标；tauri 经 image 已依赖同一版本，不增加编译量
png = "0.18"
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks"] }
indexmap = { version = "2", features = ["serde"] }
rust_decimal = "1.33"
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
json5 = "0.4"
json-five = "0.3.1"
sys-locale = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.1", features = ["v2_16"] }
gtk = "0.18"

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
rquickjs = { version = "0.8", features = ["bindgen"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSColor"] }

# Optimize release binary size to help reduce AppImage footprint
[profile.release]
# 主 crate 体量大，codegen-units = 1 时 LLVM 只能单线程跑，发布编译的大头都在它身上。
# 16 让主 crate 编译快约 64%，代价是二进制体积增加约 17%（10-05 本机基准）。
codegen-units = 16
lto = "thin"
opt-level = "s"
# 使用 unwind 以便 panic hook 能捕获 backtrace（abort 会直接终止无法捕获）
panic = "unwind"
strip = "symbols"

[dev-dependencies]
tokio-tungstenite = "0.24"
serial_test = "3"
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
