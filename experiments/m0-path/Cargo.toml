[package]
name = "si-assist-path-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[dependencies]
axum = "=0.7.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "time", "process"] }
futures = "0.3"
tempfile = "3"
async-stream = "0.3"

[profile.dev]
debug = 0
incremental = false
